# Install once: uvx pre-commit install
# Icons and the rates snapshot are copied in as they come, so the fixers leave them alone.
exclude: ^assets/(icons/|rates-fallback\.json$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  # keep rev in step with the ruff version in uv.lock, so the hook and CI agree
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
