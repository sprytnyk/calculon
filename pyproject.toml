[project]
name = "calculon"
description = "Natural-language notepad calculator"
readme = "README.md"
license = "MIT"
authors = [{ name = "sprytnyk.dev" }]
requires-python = ">=3.14,<3.16"
version = "0"  # real version comes from the git tag, see scripts/write_version.py
dependencies = [
    "PySide6-Essentials>=6.12",
    "pint>=0.26",
    "python-dateutil>=4.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22",
    "pytest>=8",
    "ruff>=0.8",
    "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
