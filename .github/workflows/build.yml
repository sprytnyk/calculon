name: Release builds

# Pushing a vX.Y.Z tag builds a release. A manual run builds test binaries with a
# 0.0.0.dev0+... version. Builds stay as run artifacts; the GitHub release is made
# locally with the release skill, which signs SHA256SUMS.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  UV_PYTHON_DOWNLOADS: never

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: |
          # system libraries Qt needs for the offscreen UI tests
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          uv sync --locked --python "${{ steps.python.outputs.python-path }}"
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Tests
        run: uv run --no-sync pytest
      - name: Known vulnerabilities in dependencies
        run: |
          uv export --locked --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run --no-sync pip-audit --strict --require-hashes --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux_x64
            arch: x64
          - os: windows-2022
            target: windows_x64
            arch: x64
          # macos-14 was retired on 2 Nov 2026; macos-15-intel lasts until autumn 2027
          - os: macos-15-intel
            target: macos_x64
            arch: x64
            mac_arch: x86_64
          - os: macos-15
            target: macos_arm64
            arch: arm64
            mac_arch: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.arch }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: uv sync --locked --python "${{ steps.python.outputs.python-path }}"
      - name: Write version
        id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: echo "version=$(uv run --no-sync python scripts/write_version.py $TAG)" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          CALCULON_TARGET_ARCH: ${{ matrix.mac_arch }}
        run: uv run --no-sync pyinstaller calculon.spec --clean --noconfirm
      - name: System libraries Qt loads at start (Linux)
        if: runner.os == 'Linux'
        run: |
          # PyInstaller leaves libEGL and libGL out on purpose: they come with the GPU driver
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1
      - name: Self-test the build
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/calculon.exe --self-test
          else
            ./dist/calculon --version
            ./dist/calculon --self-test
          fi
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          name="calculon_${VERSION}_${{ matrix.target }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp LICENSE dist/
            (cd dist && 7z a -tzip "../out/$name.zip" calculon.exe LICENSE)
          else
            cp LICENSE dist/
            tar -czf "out/$name.tar.gz" -C dist calculon LICENSE
          fi
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  collect:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: parts
          merge-multiple: true
      - name: Checksums
        run: |
          cd parts
          sha256sum calculon_* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calculon_${{ needs.build.outputs.version }}
          path: parts/*
          if-no-files-found: error
