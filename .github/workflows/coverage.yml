name: Test coverage

on:
  push:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          uv sync --locked --python "${{ steps.python.outputs.python-path }}"
          uv pip install --python .venv/bin/python --only-binary :all: --require-hashes \
            -r .github/coverage-requirements.txt
      - name: Run tests and measure coverage
        run: |
          uv run --no-sync coverage run --branch --source=calculon -m pytest --durations=15
          uv run --no-sync coverage lcov
      - name: Upload coverage to Codecov
        if: github.repository == 'sprytnyk/calculon'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.lcov
          disable_search: true
          disable_telem: true
          network_filter: calculon/
          plugins: noop
          fail_ci_if_error: true
